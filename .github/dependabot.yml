# Keeps dependencies current so advisories get fixed by a small PR instead of
# piling up (security review item 14). Security updates for vulnerable
# packages are separate and additionally need enabling under
# GitHub > Settings > Code security > Dependabot security updates.

version: 2
updates:
  - package-ecosystem: npm
    directory: /Stocksy_Server
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /Stocksy_Mobile
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    # Expo, React Native and React are upgraded together as an SDK upgrade
    # (`npx expo install`), never one package at a time, so no major-version
    # PRs here. Minor/patch updates stay on.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
