# Stocksy web/PWA: security headers (security review item 10)
#
# Usage: `include` this file in the server{} block that serves the web build AND
# inside every location{} block that has its own add_header (nginx does NOT
# inherit add_header into a location that defines one). See
# nginx-site.example.conf.
#
# Everything is `always` so the headers are also on 4xx/5xx responses.
#
# ROLLING OUT THE CSP SAFELY: first deploy with the header name changed to
#   Content-Security-Policy-Report-Only
# open the site, sign in, view a chart, place a paper order, open the console
# and look for "Refused to ..." messages. When it is clean, rename it back to
# Content-Security-Policy.
#
# What the policy says, and why:
#   script-src 'self'      Only our own bundle runs. No inline scripts, no eval
#                          (verified against the production build). This is the
#                          directive that stops injected script (XSS).
#   style-src ... inline   react-native-web injects styles at runtime and
#                          index.html has two <style> blocks, so inline styles
#                          are allowed. Scripts stay strict.
#   img-src                logo.dev logos + the Baskets screen's hot-linked
#                          images. Item 15 (logo proxy, self-hosted images)
#                          lets these two lines shrink to 'self' data: blob:.
#   connect-src            This origin + the API over https and the live-price
#                          WebSocket over wss. NOTHING else, so injected code
#                          cannot send data to an attacker's server.
#   frame-ancestors none   Nobody can frame the trading UI (clickjacking).
#   object-src/base-uri    Closed off; common XSS pivots.
#   COOP allow-popups      REQUIRED: Google sign-in opens a popup. A strict
#                          `same-origin` COOP would break that login.
#   Referrer-Policy        strict-origin: other sites (logo.dev) see only
#                          "https://www.stocksy.online", never a path.
#
# If your web/API hostnames differ, change the three stocksy.online values.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://img.logo.dev https://imgs.search.brave.com https://tradebrains-wp.s3.ap-south-1.amazonaws.com; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' https://api.stocksy.online wss://api.stocksy.online; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin" always;
add_header Permissions-Policy "accelerometer=(), bluetooth=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
