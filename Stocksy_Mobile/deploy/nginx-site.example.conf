# Example nginx server block for the Stocksy web build (the `dist/` folder made
# by `npm run build:web`). Adapt paths/server_name; TLS lines are placeholders.

server_tokens off;                      # don't advertise the nginx version

server {
    listen 80;
    server_name www.stocksy.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.stocksy.online;
    # ssl_certificate     /etc/letsencrypt/live/www.stocksy.online/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/www.stocksy.online/privkey.pem;

    root /var/www/stocksy/dist;
    index index.html;

    include /etc/nginx/snippets/stocksy-security-headers.conf;

    # Hashed build assets: cache for a year.
    location /_expo/static/ {
        include /etc/nginx/snippets/stocksy-security-headers.conf;   # required again here
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The service worker and shell must always be revalidated or updates stall.
    location = /sw.js {
        include /etc/nginx/snippets/stocksy-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /index.html {
        include /etc/nginx/snippets/stocksy-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Single-page app fallback.
    location / {
        try_files $uri /index.html;
    }
}
