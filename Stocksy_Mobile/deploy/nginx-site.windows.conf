# Stocksy PWA: nginx server block for a WINDOWS VPS.
#
# Assumes nginx lives in C:/nginx and the built site is in C:/stocksy-web/dist
# (the dist/ folder produced by `npm run build:web`). Change the paths and the
# hostname below to match your setup. Use forward slashes, even on Windows.
#
# Put this file in C:/nginx/conf/conf.d/stocksy-web.conf (or paste the server
# blocks into nginx.conf's http { } section), and make sure http { } contains:
#     include conf.d/*.conf;
#
# Copy deploy/nginx-security-headers.conf to C:/nginx/conf/snippets/stocksy-security-headers.conf
# (create the snippets folder). Paths in `include` are relative to C:/nginx/conf/.
#
# Keep ONE web hostname everywhere: this file, DNS, CORS_ORIGINS and
# GOOGLE_WEB_REDIRECT_URIS in Stocksy_Server/.env, and Google Cloud's
# authorized origins. It must share the stocksy.online domain with the API
# (cookies are SameSite=lax).

server {
    listen 80;
    server_name app.stocksy.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;                          # on nginx < 1.25.1 use:  listen 443 ssl http2;
    server_name app.stocksy.online;

    # Certificate: issue one with win-acme (wacs.exe), then point these at it.
    ssl_certificate     C:/nginx/certs/app.stocksy.online/fullchain.pem;
    ssl_certificate_key C:/nginx/certs/app.stocksy.online/privkey.pem;

    root  C:/stocksy-web/dist;
    index index.html;

    include snippets/stocksy-security-headers.conf;

    # Hashed build assets: cache for a year.
    location /_expo/static/ {
        include snippets/stocksy-security-headers.conf;   # required again here
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The service worker and shell must always be revalidated or updates stall.
    location = /sw.js {
        include snippets/stocksy-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /index.html {
        include snippets/stocksy-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Single-page app fallback (React Navigation deep links like /oauth).
    location / {
        try_files $uri /index.html;
    }
}
