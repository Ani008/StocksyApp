<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Stocksy - Offline</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: #0b0f19; color: #e5e7eb; text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      }
      img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 20px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 15px; line-height: 1.5; margin: 0 0 24px; color: #9ca3af; }
      button {
        font: inherit; font-weight: 600; color: #fff; background: #365ee0;
        border: 0; border-radius: 12px; padding: 12px 28px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Stocksy" />
      <h1>You're offline</h1>
      <p>Stocksy needs a connection for live prices and orders.<br />Check your network and try again.</p>
      <button id="retry" type="button">Try again</button>
    </main>
    <script src="/offline.js" defer></script>
  </body>
</html>
